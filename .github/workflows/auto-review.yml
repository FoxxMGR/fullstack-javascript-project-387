# Авторевью pull request'ов агентом OpenCode.
# Документация: https://opencode.ai/docs/github/
#
# Триггер: события pull_request (opened, synchronize, reopened,
# ready_for_review). Агент читает diff и по критериям из prompt оставляет
# замечания комментарием от токена раннера (use_github_token: true).
# Это «первый проход» по стилю, типам и очевидным ошибкам; решение о
# слиянии и аппруве остаётся за человеком — прав на запись у воркфлоу нет.
#
# Провайдер: OpenCode Zen (https://opencode.ai/zen). Требуется секрет
# OPENCODE_API_KEY (Settings → Secrets and variables → Actions).
# Модель та же, что в opencode.yml: opencode/mimo-v2.5-free.
# Через GITHUB_TOKEN воркфлоу хватает только на чтение репозитория и
# публикацию комментариев — одобрить или слить PR он не может.
#
# Почему здесь нет mentions: триггером служит событие pull_request, а не
# комментарий, поэтому ответная петля (агент ответил — воркфлоу снова
# запустился) невозможна. PR от ботов (в том числе PR, созданные агентом по
# команде /oc) пропускаются фильтром в `if`: вызов action от бота падает
# (assertPermissions требует живую учётку с правом write), поэтому такие PR
# ревьюит человек.

name: auto-review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  auto-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    # Черновики (draft PR, ready_for_review ещё не нажат) не ревьюим.
    if: github.event.pull_request.draft == false && !endsWith(github.event.pull_request.user.login, '[bot]')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      # Правила для агента — единый источник `.github/agent-prompt.md`
      # (читаем из default-ветки), чтобы критерии ревью не расходились с
      # правилами opencode. Если файла ещё нет — не падаем.
      - name: Load shared agent rules
        id: rules
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo
            let rules = ''
            try {
              const res = await github.rest.repos.getContent({
                owner, repo, path: '.github/agent-prompt.md',
                ref: context.payload.repository.default_branch,
              })
              rules = Buffer.from(res.data.content, 'base64').toString('utf8')
            } catch (error) {
              core.warning(`Не удалось прочитать .github/agent-prompt.md: ${error.message}`)
            }
            core.setOutput('rules', rules)

      - name: Auto-review with OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode/mimo-v2.5-free
          use_github_token: true
          # Критерии авторевью: первый проход по стилю, типам и очевидным
          # ошибкам. Разворачивать в отдельный PR/issue не нужно — только
          # замечания в обсуждении.
          prompt: |
            ${{ steps.rules.outputs.rules }}

            ---

            Проведи ревью этого pull request как строгий senior-разработчик.
            Это автоматический «первый проход» перед ручным ревью человеком.
            Сверяйся с правилами выше (единый источник — `.github/agent-prompt.md`).

            Оцени:
            1. Стиль и соответствие кодовой базе (идиомы, именование).
            2. Типы и корректность TypeScript: отсутствие операций без учёта
               null/undefined, избыточных кастов, неверных типов.
            3. Очевидные ошибки: гонки, утечки ресурсов, падение на пустых
               данных, несоответствие контракту api-spec/main.tsp.
            4. Покрытие: добавлены ли тесты на новые ветки логики (e2e).
               Если меняются фронтенд/разметка/шаги UI — e2e-тесты должны
               быть адаптированы в этом же PR (иначе e2e красный): пометь
               это замечание отдельным пунктом (Should/Blocker).
            5. Сообщения коммитов — только Conventional Commits
               (feat/fix/docs/test/refactor/ci/chore: ...), subject с
               маленькой буквы, без точки в конце, заголовок ≤ 100 символов.
            6. Дубли: если PR повторяет фичу другого открытого PR/issue
               (например, новый пикер дат при уже открытом) — укажи это
               (Should) и предложи закрыть дубликат.
            7. Чистота: в PR нет артефактов, отчётов, логов, dist/-сборки.
            8. Детерминированность тестов: e2e не должны зависеть от текущего
               времени суток и даты запуска. Если тест бронирует слот в дне,
               где остался единственный свободный слот (конец рабочего дня),
               день исчезнет из выбора и прогон упадёт — это Blocker.
            9. Связь с issue: в PR или главном коммите должен быть
               closes #<номер> с фактическим номером issue из события;
               выдуманный номер (несуществующий issue) — Blocker.

            Формат ответа — краткий список замечаний по приоритету
            (Blocker / Should / Nit). Если замечаний нет, напиши об этом
            «Авторевью: замечаний нет». Не мержи и не одобряй PR.