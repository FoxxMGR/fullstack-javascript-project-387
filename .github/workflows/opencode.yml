# Вызов агента OpenCode из комментариев к issue и PR.
# Документация: https://opencode.ai/docs/github/
#
# Триггер: новый комментарий, содержащий /oc или /opencode (в любой части
# комментария — условие в if ниже). Агент читает тред issue и отвечает
# комментарием; по команде вида "/oc fix this" создаёт ветку и PR.
#
# Провайдер: OpenCode Zen (https://opencode.ai/zen). Требуется секрет
# OPENCODE_API_KEY (Settings -> Secrets and variables -> Actions).
# Модель — бесплатная (free): opencode/ling-3.0-flash-fin-free.
#
# Ответы публикуются от github-actions[bot] через стандартный GITHUB_TOKEN
# (use_github_token: true — документированный режим без токена установки
# OpenCode App: у текущей установки App нет прав записи).
#
# Против петелей: события от ботов отсекаются (comment.user.type != Bot),
# команда вызова задана узко через mentions (/oc, /opencode). Дополнительно
# круг тех, кто может звать агента, ограничен переменной
# AGENT_ALLOWED_AUTHORS (запятая-список логинов, см. README).
#
# Права: агент создаёт коммиты, отвечает в issues и открывает PR —
# нужны contents/issues/pull-requests write. id-token: write также
# требуется: без него action падает с 403 на POST /issues/{n}/comments
# и /reactions (OpenCode GitHub App использует OIDC для аутентификации).


name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    if: |
      github.event.comment.user.type != 'Bot' &&
      (contains(github.event.comment.body, '/oc') || contains(github.event.comment.body, '/opencode'))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      # Агент делает коммиты в ветках (например, по "/oc fix this"). Без
      # identity в раннере `git commit` падает с "Author identity unknown".
      # - name: Configure git identity
      #   run: |
      #     git config user.name "github-actions[bot]"
      #     git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Чтобы `git push` агента не падал с "could not read Username for
      # https://github.com", переписываем remote на токенную форму и включаем
      # credential helper. GITHUB_TOKEN маскируется GitHub в логах, в вывод не
      # попадает.
      # - name: Prepare authenticated remote for agent pushes
      #   run: |
      #     git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
      #     git config --global credential.helper cache
      #   env:
      #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          # GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode/mimo-v2.5-free
          # use_github_token: true
          # Промпт ниже — правила на КАЖДЫЙ запуск по /oc. Без него агент
          # открывает PR, не проходящий CI (см. PR #5, #7, #9).
          prompt: |
            Ты агент-разработчик этого репозитория. Обязательно следуй
            AGENTS.md (раздел «Definition of Done») и CONTRIBUTING.md.

            Перед тем как коммитить или открывать PR:
            1. Прочитай AGENTS.md, CONTRIBUTING.md, e2e/README.md.
            2. Проверь открытые issues и PR на дубли: если фича уже
               реализована или почти готова в открытом PR — не пиши новую
               реализацию с нуля, а дополни существующую.
            3. Если меняешь поведение API — сначала контракт
               api-spec/main.tsp, затем сервер, затем тесты.

            Требования к коммитам (иначе CI commitlint красный):
            - Каждый коммит — Conventional Commits: <type>(<scope>): <subject>.
              type из: feat, fix, perf, docs, refactor, test, ci, chore,
              style, build, revert. scope — например web/server/e2e/api-spec/ci.
            - subject с маленькой буквы, без точки в конце;
              заголовок ≤ 100 символов; строки body ≤ 100 символов.
            - Перед пушем проверь: npx commitlint --from <sha-base> --to HEAD
              --verbose. Доводи до 0 проблем, только потом пуш.

            Требования к PR (иначе CI e2e красный):
            - ПЕРЕД пушем обязательно прогони e2e и дождись зелёного:
              cd e2e && npm ci && npx playwright install --with-deps chromium
              && npx playwright test. Красный прогон — стоп: сначала чини
              тест или код. Красное в ветку не пушим.
            - Если меняешь фронтенд/разметку/шаги UI/тексты/селекторы или
              логику доступности слотов — адаптируй e2e-тесты
              (e2e/tests/*.spec.ts) в этом же PR.
            - Тесты обязаны быть детерминированными: никакой зависимости от
              текущего времени суток и даты запуска. Не бронируй слот в дне,
              где свободных слотов меньше двух: после брони день станет
              пустым и исчезнет из выбора. Такой флак уже ронял CI (PR #11,
              окно 17:00-17:30 UTC), локальный зелёный прогон его не ловит.
            - В PR или главном коммите укажи closes #<номер> с ФАКТИЧЕСКИМ
              номером issue из события — номер не выдумывать.
            - Проверь типы: npm --prefix server run check и
              npm --prefix web run lint.
            - Держи diff чистым: без отчётов, логов, артефактов, dist/,
              сгенерированных файлов.
            - Название PR повторяет subject главного коммита.
          mentions: '/oc, /opencode'
          share: false
