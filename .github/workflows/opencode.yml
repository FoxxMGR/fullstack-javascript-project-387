# Вызов агента OpenCode из комментариев к issue и PR.
# Документация: https://opencode.ai/docs/github/
#
# Триггер: новый комментарий, содержащий /oc или /opencode (в любой части
# комментария — условие в if ниже). Агент читает тред issue и отвечает
# комментарием; по команде вида "/oc fix this" создаёт ветку и PR.
#
# Провайдер: OpenCode Zen (https://opencode.ai/zen). Требуется секрет
# OPENCODE_API_KEY (Settings -> Secrets and variables -> Actions).
# Модель — бесплатная (free): opencode/mimo-v2.5-free.
#
# Аутентификация — OIDC: action обменивает id-token запуска на токен установки
# OpenCode App (про App: https://opencode.ai/docs/github/). Режим
# use_github_token здесь выключен — он нужен там, где прав App не хватает
# (пример — auto-review.yml). Токеном App action сам настраивает git-remote
# агента, поэтому push и создание PR работают без отдельного шага.
#
# Против петелей: события от ботов отсекаются (comment.user.type != Bot),
# команда вызова задана узко через mentions (/oc, /opencode). Дополнительно
# круг тех, кто может звать агента, ограничен переменной
# AGENT_ALLOWED_AUTHORS (запятая-список логинов, см. README).
#
# Права: агент создаёт коммиты, отвечает в issues и открывает PR —
# нужны contents/issues/pull-requests write. id-token: write также
# требуется: без него action падает с 403 на POST /issues/{n}/comments
# и /reactions (OpenCode GitHub App использует OIDC для аутентификации).


name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    if: |
      github.event.comment.user.type != 'Bot' &&
      (contains(github.event.comment.body, '/oc') || contains(github.event.comment.body, '/opencode'))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      # Идентичность коммитов и credentials для push action настраивает сам
      # (configureGit) токеном App — отдельные шаги не нужны. Поэтому checkout
      # ниже идёт с persist-credentials: false: свой токен action подставит сам.

      # Правила для агента — единый источник `.github/agent-prompt.md`
      # (читаем из default-ветки). Правишь файл один раз — правило действует
      # сразу на всех issues/PR, напоминать агенту в комментариях не нужно.
      # Если файла ещё нет в default-ветке, воркфлоу не падает: шаг только
      # предупреждает, а в промпте остаётся короткая задача ниже.
      - name: Load shared agent rules
        id: rules
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo
            let rules = ''
            try {
              const res = await github.rest.repos.getContent({
                owner, repo, path: '.github/agent-prompt.md',
                ref: context.payload.repository.default_branch,
              })
              rules = Buffer.from(res.data.content, 'base64').toString('utf8')
              core.info(`Правила загружены: ${rules.length} символов`)
            } catch (error) {
              core.warning(`Не удалось прочитать .github/agent-prompt.md: ${error.message}`)
            }
            core.setOutput('rules', rules)

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode/mimo-v2.5-free
          # Промпт ниже — правила на КАЖДЫЙ запуск по /oc. Без него агент
          # открывает PR, не проходящий CI (см. PR #5, #7, #9, #11).
          prompt: |
            ${{ steps.rules.outputs.rules }}

            ---

            ## Твоя задача в этом запуске

            Выполни запрос из комментария автора настолько, насколько он
            сформулирован; если это вопрос — ответь объяснением без коммитов.
            Работай строго по правилам выше (Definition of Done, коммиты,
            e2e, детерминированность, отсутствие дублей).
          mentions: '/oc, /opencode'
          share: false
